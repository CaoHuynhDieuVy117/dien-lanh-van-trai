<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-label="Tủ lạnh Samsung hai cửa màu bạc">
  <defs>
    <linearGradient id="doorL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f4"/>
      <stop offset="0.48" stop-color="#d9dcda"/>
      <stop offset="1" stop-color="#bfc3c2"/>
    </linearGradient>
    <linearGradient id="doorR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ef"/>
      <stop offset="0.5" stop-color="#d4d7d5"/>
      <stop offset="1" stop-color="#b8bcbb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454a4d"/>
      <stop offset="1" stop-color="#171b1e"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <ellipse cx="180" cy="270" rx="88" ry="16" fill="#6dbdf0" opacity="0.08" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <rect x="95" y="24" width="170" height="238" rx="6" fill="#15191c"/>
    <rect x="98" y="27" width="78" height="232" rx="4" fill="url(#doorL)" stroke="#f8faf9" stroke-opacity="0.68"/>
    <rect x="184" y="27" width="78" height="232" rx="4" fill="url(#doorR)" stroke="#f8faf9" stroke-opacity="0.65"/>
    <rect x="176" y="27" width="8" height="232" fill="url(#edge)"/>

    <path d="M104 33h66" stroke="#fff" stroke-opacity="0.42" stroke-width="2"/>
    <path d="M190 33h66" stroke="#fff" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M102 255h72" stroke="#8d9292" stroke-opacity="0.45"/>
    <path d="M186 255h72" stroke="#8d9292" stroke-opacity="0.45"/>

    <text x="224" y="48" fill="#f8fafb" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.1">SAMSUNG</text>

    <rect x="229" y="60" width="20" height="31" rx="2" fill="#111820" stroke="#e8ecef" stroke-width="1"/>
    <text x="239" y="75" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">10</text>
    <text x="239" y="82" text-anchor="middle" fill="#dce5ea" font-family="Arial, sans-serif" font-size="3.4" font-weight="700">YEAR</text>
    <text x="239" y="87" text-anchor="middle" fill="#dce5ea" font-family="Arial, sans-serif" font-size="3.2">WARRANTY</text>

    <rect x="229" y="96" width="20" height="27" rx="2" fill="#dce8e7" stroke="#f5f8f8"/>
    <rect x="231" y="98" width="16" height="7" rx="1" fill="#62a49f"/>
    <circle cx="234" cy="101.5" r="1" fill="#ffd36b"/>
    <circle cx="238" cy="101.5" r="1" fill="#ffd36b"/>
    <circle cx="242" cy="101.5" r="1" fill="#ffd36b"/>
    <rect x="232" y="108" width="14" height="2" rx="1" fill="#6a8585" opacity="0.75"/>
    <rect x="232" y="113" width="11" height="2" rx="1" fill="#6a8585" opacity="0.55"/>
    <rect x="232" y="118" width="13" height="2" rx="1" fill="#6a8585" opacity="0.45"/>

    <rect x="107" y="259" width="16" height="5" rx="2.5" fill="#30363a"/>
    <rect x="237" y="259" width="16" height="5" rx="2.5" fill="#30363a"/>
  </g>
