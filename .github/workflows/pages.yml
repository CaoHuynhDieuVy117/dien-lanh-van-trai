name: Đưa website lên GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy nội dung website
        uses: actions/checkout@v4

      - name: Chuẩn bị GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Xuất bản website
        id: deployment
        uses: actions/deploy-pages@v4
